[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yuki-digital-diva"
version = "2.4.0"
description = "Yuki - Diva Digital Autónoma basada en el arnés Hermes Agent con memoria SQLite FTS5, Honcho y Nous Portal"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yuki Project Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["output", "recursos extra", ".venv"]

[tool.ruff.lint]
# Conjunto deliberadamente corto. Este proyecto tiene una voz propia en el
# código —comentarios largos en castellano que explican el porqué, nombres en
# castellano— y un linter que pelee con eso acaba desactivado. Se conservan las
# reglas que encuentran fallos de verdad (F: pyflakes) y la higiene básica.
#
# El linter ya se ganó el sitio: encontró dos NameError vivos, uno de ellos en
# la ruta de la reflexión nocturna, que ninguna prueba tocaba.
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    # Líneas largas: los comentarios explicativos de este proyecto las tienen y
    # partirlas empeora la lectura.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Los módulos de prueba importan cosas que sólo usan para forzar un fallo.
"tests/*" = ["F841"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/serverless/*",
    # Conversación, Salón, daemon, benchmark y comprobación de proveedores. La
    # suite no debe ejecutarlos: arrancan servidores, salen a la red o gastan
    # crédito. `tests/test_cli.py` guarda su superficie ejecutándolos como
    # subproceso —lo fiel— y la cobertura no puede ver dentro de un subproceso,
    # así que contarlos aquí sólo añadiría un cero que no significa nada.
    "src/cli/operacion.py",
]

[tool.coverage.report]
# El umbral es el que hay hoy, no una aspiración: sirve para que la cobertura no
# baje sin que nadie lo note, no para presumir de un número. Sube a 80 porque
# hoy hay 80.6: dejarlo en 78 permitiría perder en silencio lo que costó ganar.
#
# Sólo cuenta `src/`. Los guiones de `scripts/` tienen sus propias pruebas, pero
# la mitad se ejecutan como subproceso en la CI —romper a Yuki a propósito,
# restaurar una copia— y contarlos aquí daría un número que no significa nada.
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
