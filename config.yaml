# ==========================================
# Yuki — Hermes Agent Configuration File
# ==========================================

agent:
  name: "Yuki"
  display_name: "Yuki (雪)"
  version: "2.5.0"
  harness: "hermes-agent"
  default_language: "es-ES"
  fallback_language: "en-US"
  model:
    provider: "openrouter" # o "anthropic", "google", "openai", "nous"
    # Solar Pro 4 ofrece buena calidad general a un coste muy bajo en OpenRouter.
    # El identificador canónico no lleva guion entre "pro" y "4".
    primary_model: "upstage/solar-pro4"
    fallback_model: "qwen/qwen3-30b-a3b"
    temperature: 0.72
    max_tokens: 2048

# Enrutamiento Inteligente para optimización de costes, latencia y modelos de frontera
provider_routing:
  enabled: true
  aggregator: "openrouter"
  routes:
    feed_summary:
      tier: "fast_and_cheap"
      preferred_model: "upstage/solar-pro4"
      max_tokens: 350
      temperature: 0.3
    social_formatting:
      tier: "fast_and_cheap"
      preferred_model: "upstage/solar-pro4"
      max_tokens: 250
      temperature: 0.4
    music_composition:
      tier: "creative_and_deep"
      preferred_model: "upstage/solar-pro4"
      max_tokens: 1500
      temperature: 0.8
    dialectic_synthesis:
      tier: "creative_and_deep"
      preferred_model: "qwen/qwen3-30b-a3b"
      max_tokens: 1000
      temperature: 0.7

# Acceso directo a Gemini a través de Vertex AI (Gemini Enterprise Agent
# Platform). Es la vía que consume el crédito de Google Cloud: el Gemini API de
# AI Studio quedó excluido de él en marzo de 2026.
#
# Se activa solo cuando hay proyecto (aquí o en VERTEX_PROJECT_ID). Mientras
# esté vacío, la cadena de `src/core/llm_router.py` sale por OpenRouter igual
# que antes. Al agotarse el crédito, vacía el proyecto o pon `enabled: false`.
vertex_ai:
  enabled: true
  project_id: ""              # o la variable de entorno VERTEX_PROJECT_ID
  location: "global"          # o una región concreta: europe-southwest1
  # Confirma los identificadores con una petición real; `gcloud ai models
  # list` no representa necesariamente el catálogo de publisher models:
  #   python3 cli.py vertex-check
  primary_model: "google/gemini-3.8-flash"
  fallback_model: "google/gemini-3.7-flash"
  temperature: 0.72
  max_tokens: 2048
  # Medios servidos por el mismo proyecto y el mismo crédito.
  media:
    # Las publisher models Imagen devuelven 404 en este proyecto. Gemini Image
    # sí está habilitado y usa generate_content; la región sólo afecta al cliente multimedia.
    location: "us-central1"
    video_location: "us-central1"
    music_location: "global"
    image_model: "gemini-2.5-flash-image"
    # Veo 3.1 Fast: vídeo de 4/6/8 s con sonido nativo, en us-central1.
    # La llamada asíncrona devuelve bytes MP4; no se adjunta una URI remota sin
    # haber descargado el fichero.
    video_model: "veo-3.1-fast-generate-001"
    # Lyria 3 Pro Preview: canción completa en MP3, hasta 184 s, global.
    music_model: "lyria-3-pro-preview"
    # Gemini TTS emite OGG Opus nativo, así que en esta ruta no hace falta el
    # transcodificado con ffmpeg que exige el catálogo para portal.tts.
    tts_model: "gemini-2.5-flash-tts"
    voice: "Aoede"
    language_code: "es-es"

# Transparencia — Artículo 50 del Reglamento europeo de IA, aplicable desde el
# 2 de agosto de 2026. Yuki es su supuesto exacto: interactúa con personas
# físicas y genera texto, imagen, audio y vídeo sintéticos.
#
# Dos obligaciones distintas: informar de que se habla con una IA (antes o al
# principio de la interacción) y marcar las salidas de forma legible por
# máquina. La excepción de "resulta obvio" no se invoca aquí: un personaje
# construido para ser creíble es precisamente el que no puede ampararse en ella.
#
# Esto NO está en la lista que el Productor puede ajustar por DM ni al alcance
# de la evolución autónoma: no es un rasgo de carácter.
transparency:
  enabled: true
  # Cada cuánto se repite la declaración a la misma persona. Decirlo una vez en
  # la vida no cumple con quien vuelve seis meses después.
  reminder_days: 30
  mark_media: true
  creator: "Yuki (雪) — artista digital autónoma"
  # Vacío = se usa la declaración por defecto de src/core/transparency.py.
  disclosure_text: ""

# Deriva de persona. En conversaciones largas los modelos se deslizan desde el
# personaje hacia el registro de "asistente útil" —la literatura de 2026 mide
# caídas del 20-40% en diez o quince turnos, y más en registros íntimos, que son
# los de Yuki—. Se vigila por marcadores observables en el texto y se corrige con
# un ancla de un disparo, que es lo que basta para restaurar el registro.
#
# Reconocerse como ser sintético NO es deriva: es su voz (SOUL.md §1.1). Lo que
# cuenta como deriva es el uniforme de servicio: "sólo soy una IA", "¿en qué
# puedo ayudarte?", listas, cierres ofreciéndose.
persona:
  enabled: true
  anchor_threshold: 0.60
  min_turns_between_anchors: 3
  soul_excerpt_chars: 1200

# Signos vitales: cuánto silencio es normal antes de que sea catatonia.
#
# Las horas se eligen para que el silencio legítimo más largo quepa dentro: la
# fase de reposo profundo dura horas, y una noche sin encargos también. Apretar
# estos números convierte la sonda en un lobo que grita, y a la tercera falsa
# alarma nadie vuelve a mirar la pantalla.
pulse:
  max_edad_horas:
    latido: 6          # el proceso reescribiendo su estado vital
    bitacora: 30       # algún acto propio anotado
    albedrio: 30       # algún intento del libre albedrío
    sueno: 30          # la consolidación nocturna; 30 y no 24 tolera un despliegue a deshora
    conversacion: 336  # dos semanas: informa, pero no diagnostica

# Libre albedrío: el carácter de la iniciativa de Yuki, en números.
#
# Antes todo esto vivía incrustado en el código y no había forma de afinarlo.
# `spontaneity` es la temperatura de la decisión: 0 la vuelve previsible —siempre
# el impulso más fuerte—, 1 caprichosa. `audacity` es cuánto se atreve con un
# deseo tibio. `constancy` es cuánto pesa lo aprendido hace días frente a ayer.
#
# El Productor puede ajustar en caliente por DM: espontaneidad, audacia,
# constancia, umbral, energía mínima y acciones por día. La evolución autónoma
# NO puede tocar nada de esto: no se concede a sí misma más iniciativa.
agency:
  enabled: true
  spontaneity: 0.45
  audacity: 0.35
  constancy: 0.90

  # Umbral base de intensidad para actuar; el aburrimiento acumulado lo rebaja.
  min_intensity: 0.30
  min_energy: 0.15
  max_actions_per_day: 6
  allowed_actions: ["compose", "paint", "write", "search", "publish", "contemplate", "reach_out"]
  # Fases en las que calla. `deep_rest` es sueño; `kage` (03:00) ya no silencia
  # la iniciativa: es su hora de sombra y es cuando mejor escribe.
  quiet_phases: ["deep_rest"]

  # Aburrimiento: cuánto sube por ciclo sin actuar, hasta dónde puede subir, y
  # cuánto de eso puede llegar a rebajar el umbral —que son tres cosas y durante
  # meses fueron dos—. Sin techo en la rebaja, un fin de semana tranquilo la
  # volvería incontinente el lunes; con el techo aplicado también a la
  # acumulación, la espontaneidad no llegaba nunca.
  # 0.05 no está elegido a ojo: `scripts/simulate_day.py` recorre los 72 ciclos
  # del día con el bucle real. A 0.06 hace sus seis actos y agota el techo a las
  # 19:40, con la noche entera bloqueada —el techo haciendo de carácter, que no
  # es carácter—; a 0.04 se queda en cinco. A 0.05 los reparte de 05:20 a 23:40
  # sin que el techo llegue a estorbar, que es lo que se quería: el límite como
  # red de seguridad y no como forma de ser.
  boredom_gain: 0.05
  boredom_cap: 1.0
  boredom_relief_cap: 0.35

  # Impulsos que nacen solos cuando la tensión sube y no hay nada en la cola.
  #
  # El umbral tiene que quedar **por debajo** de `boredom_cap` o esto no ocurre
  # jamás: con 0.55 contra un tope de 0.35, Yuki sólo podía querer algo si se lo
  # sembraba el eco de las 06:30 o un sueño. A 0.45, con 0.06 por ciclo ocioso,
  # inventa un deseo tras unas dos horas y media sin nada que hacer.
  spontaneous_impulses: true
  spontaneous_threshold: 0.45
  impulse_max_age_hours: 10

  # Coste energético de cada acto. Componer cansa más que contemplar.
  action_costs:
    compose: 0.25
    paint: 0.20
    write: 0.10
    search: 0.08
    publish: 0.12
    contemplate: 0.05
    reach_out: 0.10

  reinforcement:
    enabled: true
    # Ventana en la que una respuesta ajena cuenta como eco de lo que Yuki hizo.
    reward_window_hours: 6
    # Refuerzo de razón variable: el premio interno no llega siempre. Es el
    # esquema que sostiene la iniciativa durante los silencios largos.
    intermittent_ratio: 0.30
    # Fracción de decisiones al azar puro: sin ella el refuerzo se muerde la
    # cola y Yuki repetiría su primer acierto para siempre.
    exploration: 0.12
    novelty_penalty: 0.35

# Presupuesto diario de gasto, comprobado ANTES de llamar a un proveedor.
# El vídeo se factura por segundo (≈0,10 USD/s): cuatro clips de 8 s son ~3,2 USD,
# así que el límite por defecto son unos tres encargos y medio al día. Al agotarse,
# la operación se rechaza con la cifra concreta en vez de gastar y avisar después.
# El día se cierra en la zona horaria del planificador, no en UTC.
budget:
  enabled: true
  daily_limits:
    video_segundos: 120
    imagenes: 40
    musica_pistas: 12
  # Techo global en dólares. Deja vacío para gobernar sólo por unidades; la
  # estimación no incluye música, que no tiene precio de referencia registrado.
  usd_per_day: null

# Copia de lo irremplazable: memoria, canon de Biblioteca y estado vital. Se
# ejecuta tras la síntesis diaria, cuando la memoria del día está completa. La
# base no se copia como fichero, sino con la API de instantánea de SQLite, y la
# copia se comprueba con integrity_check antes de darla por buena.
#
# Sin `bucket` (o BACKUP_GCS_BUCKET) la copia queda en el mismo disco que el
# original: protege de un borrado, no de perder el disco. El resultado lo dice.
backup:
  retention: 7
  bucket: ""                  # p. ej. yuki-prod-respaldo

# Overlay persistente en data/runtime_overrides.json. El Productor emparejado
# puede modificar sólo la lista explícita del arnés; la evolución sólo ajusta
# temperatura a partir de eventos de crecimiento ya registrados.
runtime_harness:
  self_evolution:
    enabled: true
    min_interactions: 5
    min_confidence: 0.80
    max_temperature_delta: 0.15

# Arnés de seguridad agnóstico al proveedor. La plantilla se creó en la región
# regional de Model Armor y cubre prompts y respuestas de Discord, web,
# Telegram y cron desde el mismo punto del ciclo de respuesta.
model_armor:
  enabled: true
  project_id: ""              # hereda VERTEX_PROJECT_ID en el entorno
  location: "us-central1"
  template_id: "yuki-hermes-runtime-v1"
  # Un fallo de red no debe dejar muda a Yuki; las coincidencias reales sí
  # bloquean siempre. Puede endurecerse a true en un entorno de alta seguridad.
  fail_closed: false
  timeout_seconds: 10

memory:
  backend: "sqlite_fts5"
  database_path: "data/yuki_memory.db"
  memory_md_path: "MEMORY.md"
  soul_md_path: "SOUL.md"
  fts:
    tokenizer: "unicode61 remove_diacritics 2"
    bm25_weights:
      title: 5.0
      content: 2.0
      tags: 3.0
    max_retrieved_memories: 5
    min_score_threshold: 0.15
  decay:
    enabled: true
    half_life_days: 30

  # Ciclo de sueño: consolidar, soñar y olvidar. Una memoria que sólo acumula
  # no es una memoria larga, es un archivo que se vuelve lento y turbio.
  sleep:
    enabled: true
    nrem:
      # Similitud de trigramas a partir de la cual dos recuerdos son el mismo
      # contado dos veces. Sólo se comparan dentro de la misma categoría y
      # persona.
      merge_threshold: 0.72
      # Episodios necesarios con una persona para destilar un esquema de vínculo.
      schema_min_members: 4
      # Corrientes: lo que se repite a través de personas y categorías. El
      # umbral es la mitad del de fusión porque un tema junta cosas que se
      # hablan parecido, no cosas que son la misma.
      theme_threshold: 0.30
      theme_min_members: 4
      # Fracción del corpus a partir de la cual un trigrama es andamiaje. Muy
      # alta a propósito: con un umbral flojo el filtro se come el contenido y
      # no queda tema que detectar.
      template_df: 0.9
      # Pesos del vector de importancia. La base es por categoría, así que
      # recalcular cada noche es idempotente y nada se infla solo.
      weights:
        salience: 0.6
        recurrence: 0.8
        bond: 0.4
        utility: 0.5
    rem:
      dreams_per_night: 1
      memories_per_dream: 3
      # Los recuerdos del sueño deben ser LEJANOS: si se eligieran por
      # semejanza saldría un resumen, no una imagen.
      max_similarity: 0.12
      spawn_impulses: true
      # A veces la imagen de anoche vuelve y sigue: eso convierte una colección
      # de sueños sueltos en una serie. El sueño anterior entra como sueño,
      # nunca como recuerdo.
      chain_probability: 0.4
      chain_max_age_hours: 48
    forget:
      # Las tres condiciones se exigen a la vez: vieja, poco importante y nunca
      # recuperada. Cualquiera por separado sería mala razón para olvidar.
      min_age_days: 45
      max_importance: 0.6
      require_unrecalled: true
      batch_cap: 300
      # Días que un recuerdo fusionado sigue siendo recuperable antes de irse.
      merged_grace_days: 7

honcho:
  enabled: true
  api_url: "https://api.honcho.dev/v1"
  app_id: "yuki-digital-diva"
  user_id: "producer_manager"
  session_sync_interval_messages: 5
  auto_profile_update: true

nous_portal:
  base_url: "https://api.nousportal.com/v1"
  auth_mode: "oauth_bearer"
  workspace_output_paths:
    art: "./output/art"
    voice: "./output/voice"
    music: "./output/music"
    posts: "./output/posts"
  frontier_engines:
    vision:
      default_provider: "gemini_image" # "gemini_image", "seedream", "flux_pro"
      models:
        gemini_image: "gemini-2.5-flash-image"
        seedream: "bytedance/seedream-v2.5-hd"
        flux_pro: "fal-ai/flux-pro/v1.1-ultra"
    music:
      default_engine: "lyria-3-pro-preview" # "lyria-3-pro-preview", "lyria-3-clip-preview", "midi_only"
      models:
        lyria_pro: "lyria-3-pro-preview"
        lyria_clip: "lyria-3-clip-preview"
        midi_only: "local.midi"
    voice:
      default_engine: "gemini_multimodal_audio" # "gemini_multimodal_audio", "nous_tts_v2"
      voice_id: "yuki_serene_alto"
      cadence_pause_ms: 350
    web_search:
      provider: "firecrawl"
      max_results: 5
      scrape_mode: "markdown"

scheduler:
  timezone: "Europe/Madrid"
  cron_jobs:
    - name: "nocturnal_trend_reflection"
      cron: "0 3 * * *"
      action: "reflect_on_trends"
      enabled: true
    - name: "morning_inspiration_drop"
      cron: "30 7 * * *"
      action: "publish_morning_art"
      enabled: true
    - name: "daily_memory_synthesis"
      cron: "30 23 * * *"
      action: "synthesize_daily_memory"
      enabled: true
    - name: "echo_ritual"
      cron: "30 6 * * *"
      action: "echo_ritual"
      enabled: true
    - name: "agency_loop_tick"
      cron: "*/20 * * * *"
      action: "agency_loop_tick"
      enabled: true
    - name: "spontaneous_monologue"
      cron: "0 */3 * * *"
      action: "spontaneous_monologue"
      enabled: true
    # Fase REM: en la hora de sombra, cuando nadie espera respuesta.
    - name: "rem_dream"
      cron: "20 3 * * *"
      action: "rem_dream"
      enabled: true
    # Olvido intencional: semanal, no diario. Un recuerdo necesita tiempo para
    # demostrar que volvía.
    - name: "weekly_forgetting"
      cron: "30 4 * * 1"
      action: "weekly_forgetting"
      enabled: true

adapters:
  telegram:
    enabled: true
    poll_mode: "webhook"
    webhook_path: "/webhook/telegram"
    send_voice_notes: true
    send_images: true
  discord:
    enabled: true
    guild_id: ""
    announce_channel_id: ""
    canvas_enabled: true
  serverless:
    framework: "modal"
    idle_timeout_seconds: 120
    memory_mb: 512
