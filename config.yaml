# ==========================================
# Yuki — Hermes Agent Configuration File
# ==========================================

agent:
  name: "Yuki"
  display_name: "Yuki (雪)"
  version: "2.5.0"
  harness: "hermes-agent"
  default_language: "es-ES"
  fallback_language: "en-US"
  model:
    provider: "nous"            # Nous Portal es el agregador principal
    base_url: "https://inference-api.nousresearch.com/v1"
    primary_model: "anthropic/claude-sonnet-4.6"
    fallback_provider: "openrouter"   # auxiliar: sólo si el Portal falla o agota créditos
    fallback_model: "anthropic/claude-sonnet-4.5"
    temperature: 0.72
    max_tokens: 1024

# Enrutamiento Inteligente para optimización de costes, latencia y modelos de frontera
# Jerarquía: Nous Portal es el agregador principal; OpenRouter es el auxiliar de respaldo.
provider_routing:
  enabled: true
  aggregator: "nous_portal"
  fallback_aggregator: "openrouter"
  routes:
    feed_cleanup:
      tier: "tier_0_reflex"
      max_tokens: 350
      temperature: 0.3
    social_formatting:
      tier: "tier_0_reflex"
      max_tokens: 250
      temperature: 0.4
    music_composition:
      tier: "tier_1_creative"
      max_tokens: 800
      temperature: 0.8
    poetry_and_ceremony:
      tier: "tier_1_creative"
      max_tokens: 800
      temperature: 0.75
    dialectic_synthesis:
      tier: "tier_2_nuclear"
      max_tokens: 1000
      temperature: 0.7
    daily_synthesis:
      tier: "tier_2_nuclear"
      max_tokens: 1000
      temperature: 0.7

memory:
  backend: "sqlite_fts5"
  database_path: "data/yuki_memory.db"
  memory_md_path: "MEMORY.md"
  soul_md_path: "SOUL.md"
  fts:
    tokenizer: "unicode61 remove_diacritics 2"
    bm25_weights:
      title: 5.0
      content: 2.0
      tags: 3.0
    max_retrieved_memories: 5
    min_score_threshold: 0.15
  decay:
    enabled: true
    half_life_days: 30

honcho:
  enabled: true
  api_url: "https://api.honcho.dev/v1"
  app_id: "yuki-digital-diva"
  user_id: "producer_manager"
  session_sync_interval_messages: 5
  auto_profile_update: true

nous_portal:
  base_url: "https://api.nousportal.com/v1"
  auth_mode: "oauth_bearer"
  workspace_output_paths:
    art: "./output/art"
    voice: "./output/voice"
    music: "./output/music"
    posts: "./output/posts"
  # Backends reales del Tool Gateway. Catálogo canónico: skills/HERRAMIENTAS.md
  tool_gateway:
    image:
      default_model: "fal/flux-2-pro"
      models:
        - "fal/flux-2-pro"        # portadas y arte de alta fidelidad
        - "fal/nano-banana-pro"   # composición con texto legible
        - "fal/ideogram-v3"       # tipografía y carteles
        - "fal/recraft-v4"        # vectorial y estilo plano
    voice:
      engine: "openai_tts"
      transcription: "whisper"
      cadence_pause_ms: 350
      output_format: "ogg_opus"   # transcodificado obligatorio con ffmpeg
    web_search:
      provider: "firecrawl"
      max_results: 4
      scrape_mode: "markdown"
    browser: "browser_use"        # último recurso
    sandbox: "modal"
    video: null                   # desactivado: consume la cuota de salida de red
    music: null                   # no disponible: usar src/tools/midi_generator.py

scheduler:
  timezone: "Europe/Madrid"
  cron_jobs:
    - name: "nocturnal_trend_reflection"
      cron: "0 3 * * *"
      action: "reflect_on_trends"
      enabled: true
    - name: "morning_inspiration_drop"
      cron: "30 7 * * *"
      action: "publish_morning_art"
      enabled: true
    - name: "daily_memory_synthesis"
      cron: "30 23 * * *"
      action: "synthesize_daily_memory"
      enabled: true

adapters:
  telegram:
    enabled: true
    poll_mode: "webhook"
    webhook_path: "/webhook/telegram"
    send_voice_notes: true
    send_images: true
  discord:
    enabled: true
    guild_id: ""
    announce_channel_id: ""
    canvas_enabled: true
  serverless:
    framework: "modal"
    idle_timeout_seconds: 120
    memory_mb: 512
