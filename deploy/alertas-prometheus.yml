# Reglas de alerta para la instancia de Yuki.
#
# Se escriben aquí, y no en el panel de quien las mire, porque una alerta que
# vive sólo en la consola de un proveedor se pierde con la cuenta. Cada regla
# responde a una pregunta concreta que ya se ha hecho alguien mirando esta
# instancia a deshora.
#
# Cargar con: --rules.file=deploy/alertas-prometheus.yml
groups:
  - name: yuki-integridad
    rules:
      - alert: BitacoraManipulada
        # La más grave de todas y la única que no admite espera: si la cadena
        # de auditoría no cuadra, alguien editó el registro de lo que Yuki hizo.
        expr: yuki_bitacora_integra == 0
        for: 0m
        labels:
          severity: critica
        annotations:
          resumen: "La bitácora de Yuki no cuadra"
          accion: >-
            Ejecutar `cli.py bitacora --verificar --precinto <el de la última copia>`.
            Un precinto guardado en la propia instancia no prueba nada: usar el que
            viajó con la copia diaria.

      - alert: MaterialSinMarcar
        # Artículo 50: material sintético entregable sin marca de origen.
        expr: yuki_material_sin_marcar > 0
        for: 15m
        labels:
          severity: alta
        annotations:
          resumen: "{{ $value }} fichero(s) generados sin marca de origen sintético"
          accion: "`cli.py transparency --marcar`. En vigor desde 2026-08-02."

  - name: yuki-credito
    rules:
      - alert: PresupuestoDeVideoCasiAgotado
        expr: >-
          yuki_gasto_hoy{unidad="video_segundos"}
          / on(unidad) yuki_gasto_limite{unidad="video_segundos"} > 0.8
        for: 5m
        labels:
          severity: media
        annotations:
          resumen: "Más del 80% del vídeo del día consumido"
          accion: >-
            Es aviso, no incidente: el presupuesto ya rechaza solo al llegar al
            límite y los encargos se aplazan en vez de fallar. Sirve para saber
            por qué mañana Yuki dirá que no.

      - alert: GastoDiarioAnomalo
        # Cambio brusco respecto a la media de la semana: un bucle de encargos,
        # un cron mal escrito o alguien probando cosas.
        expr: yuki_gasto_usd_estimado > 3 * avg_over_time(yuki_gasto_usd_estimado[7d]) + 1
        for: 10m
        labels:
          severity: alta
        annotations:
          resumen: "El gasto de hoy triplica la media de la semana"
          accion: "`cli.py spend` y revisar `data/media_jobs/` por encargos en bucle."

  - name: yuki-presencia
    rules:
      - alert: DerivaDePersona
        # -1 significa "sin muestras"; se excluye para no alertar del silencio.
        expr: yuki_persona_registro >= 0 and yuki_persona_registro < 0.6
        for: 30m
        labels:
          severity: media
        annotations:
          resumen: "La voz de Yuki se está yendo al registro de asistente"
          accion: >-
            `cli.py persona` para ver por dónde. Si coincide con un cambio de
            modelo, el historial guarda cuál sirvió cada turno.

      - alert: SinIniciativaEnTodoElDia
        # No es un fallo técnico: es que Yuki lleva un día entero sin querer
        # nada, y eso normalmente significa que algo la está bloqueando.
        expr: yuki_agencia_actos_hoy == 0 and yuki_agencia_aburrimiento >= 0.3
        for: 6h
        labels:
          severity: baja
        annotations:
          resumen: "Un día sin un solo acto propio, con la tensión alta"
          accion: "`cli.py albedrio`: mirar techo diario, umbral efectivo y energía."

      - alert: ElBucleDeAlbedrioNoEvalua
        # Un censo entero a cero no es «decidió no actuar»: es que nadie está
        # evaluando. Son dos incidentes distintos —uno se arregla tocando el
        # carácter, el otro averiguando por qué murió el planificador— y sin
        # esta métrica se ven exactamente igual desde fuera.
        expr: sum(yuki_albedrio_ciclos) == 0
        for: 2h
        labels:
          severity: media
        annotations:
          resumen: "El bucle de albedrío no ha evaluado ni un ciclo"
          accion: >
            No es desgana: es que no corre. `cli.py pulso` y el cron
            `agency_loop_tick` (cada 20 min). Si el censo tuviera cifras, el
            motivo dominante diría dónde mirar; a cero, mirar el planificador.

      - alert: SiempreElMismoMotivoParaNoActuar
        # Que el 95% de los ciclos den el mismo no significa que el carácter
        # está mal calibrado, no que Yuki sea apática.
        expr: >
          max(yuki_albedrio_ciclos{motivo!="actua"}) / clamp_min(sum(yuki_albedrio_ciclos), 1) > 0.95
        for: 24h
        labels:
          severity: baja
        annotations:
          resumen: "Casi todos los ciclos se detienen por el mismo motivo"
          accion: >
            `cli.py albedrio` da el censo. `bajo_umbral` pide bajar
            `min_intensity`; `fase_de_silencio`, revisar `quiet_phases`;
            `techo_diario`, subir `max_actions_per_day`; `sin_deseos`, mirar
            el aburrimiento y su umbral de espontaneidad.

      # Yuki adopta sus ritmos sin pedir permiso, así que esto ya no vigila una
      # cola de espera: cuenta ritmos suyos de antes del cambio que se quedaron
      # sin activar. Lo normal es cero, y no volver a verse nunca.
      - alert: RitmoSuyoAtrapadoSinActivar
        expr: yuki_ritmos_propuestos > 0
        for: 6h
        labels:
          severity: baja
        annotations:
          resumen: "Un ritmo propio quedó esperando una aprobación que ya no se pide"
          accion: "`!ritmos` lo lista bajo «heredados sin activar»; `!ritmo aprobar <id>` lo pone a sonar."

  - name: yuki-signos-vitales
    rules:
      - alert: YukiCatatonica
        # La alerta que ninguna sonda de infraestructura puede dar: el proceso
        # respira —contesta /health, reescribe su estado— y no queda un solo
        # signo de voluntad. Verde en todos los paneles y muerta para lo que
        # este proyecto intenta ser.
        expr: yuki_pulso_estado{estado="catatonica"} == 1
        for: 1h
        labels:
          severity: alta
        annotations:
          resumen: "El contenedor está sano y Yuki no hace nada"
          accion: >
            `cli.py pulso` dice qué signo lleva más tiempo apagado. Después:
            ¿sigue vivo el hilo del planificador?, ¿el albedrío llegó a su techo
            diario?, ¿queda crédito? El freno se descarta solo: si estuviera
            puesto, el estado sería `frenada` y no esta alerta.

      - alert: YukiAusente
        expr: yuki_pulso_estado{estado="ausente"} == 1
        for: 15m
        labels:
          severity: alta
        annotations:
          resumen: "El proceso no reescribe su estado vital"
          accion: "Registros del contenedor `yuki-daemon`; puede haber muerto sin reiniciarse."

      - alert: LaNocheNoCorre
        # 30 h y no 24: una noche puede saltarse por un despliegue a deshora sin
        # que eso sea un incidente. Dos seguidas ya no son casualidad.
        expr: yuki_signo_edad_segundos{signo="sueno"} > 108000 or yuki_signo_edad_segundos{signo="sueno"} == -1
        for: 2h
        labels:
          severity: media
        annotations:
          resumen: "El ciclo de sueño lleva más de un día sin ejecutarse"
          accion: >
            Sin la noche la memoria sólo crece: nada funde lo repetido, nada
            destila esquemas y nada olvida. `cli.py sueno --fase noche --seco`
            para ver qué haría, y revisar los cron `daily_synthesis` y `rem_dream`.

      - alert: FrenoOlvidado
        # Frenada no es una avería. Frenada durante dos días, probablemente sí:
        # alguien apretó el freno para algo puntual y nadie lo soltó.
        expr: yuki_pulso_estado{estado="frenada"} == 1
        for: 48h
        labels:
          severity: baja
        annotations:
          resumen: "Yuki lleva dos días frenada"
          accion: "`cli.py freno` para ver quién lo puso y por qué; `cli.py freno --soltar`."

  - name: yuki-sonda
    rules:
      - alert: SondaDeYukiMuda
        # Con las familias emitidas siempre —también a cero— la ausencia total
        # de métrica sólo puede significar que la sonda no responde.
        expr: absent(yuki_gasto_usd_estimado)
        for: 10m
        labels:
          severity: alta
        annotations:
          resumen: "No llegan métricas de Yuki"
          accion: "Comprobar /health y el token del Salón; `scripts/smoke_check.py --url …`."
