# ==========================================
# Plantilla para ~/.hermes/config.yaml
# Configuración Global de Hermes Agent con Modelos de Frontera
# ==========================================

hermes:
  version: "2.5"
  default_workspace: "./"
  active_agent: "yuki"

provider_routing:
  enabled: true
  default_aggregator: "openrouter"
  
  api_keys:
    openrouter: "${OPENROUTER_API_KEY}"
    anthropic: "${ANTHROPIC_API_KEY}"
    google: "${GEMINI_API_KEY}"
    nous_portal: "${NOUS_PORTAL_API_KEY}"
    honcho: "${HONCHO_API_KEY}"

  tiers:
    tier_1_fast_and_cheap:
      description: "Tareas rápidas: lectura de feeds, moderación y formateo"
      models:
        - "openrouter/google/gemini-2.0-flash"
        - "openrouter/deepseek/deepseek-chat"
        - "openrouter/qwen/qwen-2.5-72b-instruct"
      max_tokens: 400
      temperature: 0.3

    tier_2_creative_frontier:
      description: "Tareas complejas y de frontera: composición musical, poesía y modelado dialéctico Honcho"
      models:
        - "openrouter/anthropic/claude-3.5-sonnet"
        - "openrouter/google/gemini-2.0-pro-exp"
        - "openrouter/openai/gpt-4o"
      max_tokens: 1500
      temperature: 0.75

tools:
  gateway: "nous_portal"
  nous_portal_url: "https://api.nousportal.com/v1"
  skills_directory: "./skills"
  frontier_defaults:
    vision: "gemini_image"
    music: "flow_audio"
    voice: "gemini_multimodal_audio"
